name: build

on:
  push:
  workflow_dispatch:

jobs:
  # Builds the Mac app. Needs a macOS runner; also proves the Swift code compiles.
  mac-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./mac/build_app.sh
      - name: Zip
        run: ditto -c -k --keepParent mac/build/KVMBridge.app KVMBridge.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kvmbridge-mac
          path: KVMBridge.zip

  # Runs on every push. Pins may still be unset, so this only proves the code compiles.
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check VERSION matches CHANGELOG
        run: ./scripts/check_version.sh
      - run: pip install platformio
      - name: Compile (pins may be unset)
        working-directory: firmware
        env:
          PLATFORMIO_BUILD_FLAGS: -DKVM_CI_COMPILE_ONLY=1
          KVM_BUILD: ${{ github.run_number }}
        run: pio run

  # Manual: Actions tab -> build -> Run workflow. Needs the real pins in platformio.ini.
  firmware:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: [mac-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Check VERSION matches CHANGELOG
        run: ./scripts/check_version.sh
      - name: Build
        working-directory: firmware
        env:
          KVM_BUILD: ${{ github.run_number }}
        run: pio run
      - name: Merge into one image (flash at 0x0)
        working-directory: firmware
        run: |
          B=.pio/build/cyd28
          PKG=~/.platformio/packages
          python $PKG/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
            -o $B/kvm-merged.bin --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 $PKG/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
          ls -l $B/kvm-merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: kvm-firmware
          path: |
            firmware/.pio/build/cyd28/kvm-merged.bin
            firmware/.pio/build/cyd28/firmware.bin
      - name: Get Mac app
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: kvmbridge-mac
          path: macapp
      # Stable link to the newest build:
      #   https://github.com/<owner>/<repo>/releases/latest/download/kvm-merged.bin
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          ./scripts/release_notes.sh > notes.md
          # Versioned copies for saving on disk; plain names stay so the releases/latest links work.
          mkdir -p dist
          cp firmware/.pio/build/cyd28/kvm-merged.bin "dist/kvm-merged-v${VERSION}.bin"
          cp firmware/.pio/build/cyd28/firmware.bin "dist/firmware-v${VERSION}.bin"
          cp macapp/KVMBridge.zip "dist/KVMBridge-v${VERSION}.zip"
          printf '\nBuild %s, commit %s.\nFlash `kvm-merged-v%s.bin` at `0x0`. The Mac app is `KVMBridge-v%s.zip`.\nThe same files without the version in the name (`kvm-merged.bin`, `KVMBridge.zip`) are attached too, so `releases/latest/download/...` links keep working.\n' \
            "${{ github.run_number }}" "${{ github.sha }}" "$VERSION" "$VERSION" >> notes.md
          gh release create "v${VERSION}-b${{ github.run_number }}" \
            dist/kvm-merged-v${VERSION}.bin \
            dist/firmware-v${VERSION}.bin \
            dist/KVMBridge-v${VERSION}.zip \
            firmware/.pio/build/cyd28/kvm-merged.bin \
            firmware/.pio/build/cyd28/firmware.bin \
            macapp/KVMBridge.zip \
            --repo "${{ github.repository }}" \
            --title "v${VERSION} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --latest
