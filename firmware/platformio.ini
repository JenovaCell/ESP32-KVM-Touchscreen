; Stage 1: display only.
;
; Everything board-specific lives in the "BOARD VALUES" block below.
; Pin values come from the ES3C28P datasheet and are not yet verified on the board.

[env:cyd28]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/version.py
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.3

; --- BOARD VALUES ------------------------------------------------------------
; Source: ES3C28P / ES3N28P Specification V1.0 (LCDWIKI), section 4.2. The
; Freenove 2.8" CYD appears to be this same reference design (same layout and
; labels). Not yet confirmed on the actual board. Flash 16 MB is confirmed by
; the chip's Flash ID (0x18 capacity code). PSRAM (8 MB, OPI) is left off for
; stage 1 on purpose: a wrong PSRAM mode can bootloop, and the display does not
; need it. Enable later with board_build.arduino.memory_type = qio_opi.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    ; Display: ILI9341V, 4-wire SPI, 240x320.
    ; If the picture is garbage, try -DILI9341_2_DRIVER=1 instead.
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; SPI pins. The spec calls CS the "segment control signal, low level active"
    ; and lists GPIO13 as the SPI "data signal"; read here as CS and MISO.
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_CS=10
    -DTFT_DC=46
    ; Display reset is wired to CHIP_PU (shared with the ESP32-S3 reset): no GPIO.
    -DTFT_RST=-1
    ; Backlight: high = on (GPIO45). Read in main.cpp.
    -DKVM_BACKLIGHT_PIN=45
    ; Touch (FT6336G, I2C addr 0x38). Used in stage 2. I2C is shared with the
    ; audio codec.
    -DKVM_TOUCH_SDA=16
    -DKVM_TOUCH_SCL=15
    -DKVM_TOUCH_RST=18
    -DKVM_TOUCH_INT=17
    ; If tapping the left half moves right (or vice versa), set this to 1.
    -DKVM_TOUCH_FLIP_X=0
    ; This IPS panel shows inverted colours unless inversion is switched on
    ; (confirmed on the board: green showed as pink, blue as yellow).
    -DKVM_INVERT_DISPLAY=1
    ; If red and blue are swapped instead, try -DTFT_RGB_ORDER=TFT_BGR.
    ; -DTFT_RGB_ORDER=TFT_BGR
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=0
; -----------------------------------------------------------------------------
