; Stage 1: display only.
;
; Everything board-specific lives in the "BOARD VALUES" block below.
; Every value there is an UNVERIFIED PLACEHOLDER until checked against the
; Freenove ESP32-S3 2.8" CYD tutorial / schematic.

[env:cyd28]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; --- BOARD VALUES (UNVERIFIED) ----------------------------------------------
; Flash: listing says 16 MB. PSRAM (8 MB) is left off for stage 1 on purpose:
; a wrong PSRAM mode can bootloop, and the display does not need it.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    ; Display driver. Likely ILI9341 or ST7789 on 2.8" CYD boards. CONFIRM.
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; SPI pins. CONFIRM ALL.
    -DTFT_MOSI=-1
    -DTFT_SCLK=-1
    -DTFT_MISO=-1
    -DTFT_CS=-1
    -DTFT_DC=-1
    -DTFT_RST=-1
    ; Backlight GPIO (not used by TFT_eSPI directly; read in main.cpp).
    -DKVM_BACKLIGHT_PIN=-1
    ; Some panels need colour inversion or swapped RGB order. Flip if the
    ; colours look wrong on first boot.
    ; -DTFT_INVERSION_ON=1
    ; -DTFT_RGB_ORDER=TFT_BGR
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSMOOTH_FONT=0
; -----------------------------------------------------------------------------
